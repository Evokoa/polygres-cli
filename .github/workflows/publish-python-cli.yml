name: Publish Python CLI

on:
  workflow_dispatch:
    inputs:
      publish_target:
        description: Package index to publish to
        required: true
        type: choice
        options:
          - testpypi
          - none
        default: testpypi
  push:
    tags:
      - "python-cli-v*"

permissions:
  contents: read

jobs:
  build:
    name: Validate and build CLI
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and release dependencies
        run: python -m pip install -e ".[dev]" twine

      - name: Run lint
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest

      - name: Verify release version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python tools/verify_release_version.py --tag "$GITHUB_REF_NAME"
          else
            python tools/verify_release_version.py
          fi

      - name: Build CLI distribution
        run: |
          rm -rf dist
          python -m build
          python -m twine check dist/*

      - name: Verify clean wheel installation
        run: |
          smoke_dir="$RUNNER_TEMP/polygres-cli-wheel-smoke"
          python -m venv "$smoke_dir"
          "$smoke_dir/bin/python" -m pip install dist/*.whl
          "$smoke_dir/bin/python" - <<'PY'
          import importlib.metadata
          import os
          from pathlib import Path
          import subprocess
          import sys
          from polygres_cli import __version__

          expected = importlib.metadata.version("polygres-cli")
          assert __version__ == expected
          result = subprocess.run(
              [str(Path(sys.executable).with_name("polygres")), "--version"],
              check=True,
              capture_output=True,
              env={**os.environ, "POLYGRES_API_BASE_URL": "http://127.0.0.1:9/v1"},
              text=True,
          )
          assert result.stdout.splitlines()[0] == f"polygres {expected}"
          PY

      - name: Verify clean source distribution installation
        run: |
          smoke_dir="$RUNNER_TEMP/polygres-cli-sdist-smoke"
          python -m venv "$smoke_dir"
          "$smoke_dir/bin/python" -m pip install dist/*.tar.gz
          "$smoke_dir/bin/python" - <<'PY'
          import importlib.metadata
          from polygres_cli import __version__

          assert __version__ == importlib.metadata.version("polygres-cli")
          PY

      - name: Upload CLI distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-cli-dist
          path: dist/*
          if-no-files-found: error

  publish-testpypi:
    name: Publish CLI to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish_target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/polygres-cli/
    permissions:
      id-token: write
    steps:
      - name: Download CLI distributions
        uses: actions/download-artifact@v4
        with:
          name: python-cli-dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish CLI to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/python-cli-v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/polygres-cli/
    permissions:
      id-token: write
    steps:
      - name: Download CLI distributions
        uses: actions/download-artifact@v4
        with:
          name: python-cli-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
